name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up and validate Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          validate-wrappers: true

      - name: Read and validate version
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Validate Minecraft release target
        id: minecraft
        shell: bash
        run: |
          target="$(sed -n 's/^minecraft_version=//p' gradle.properties)"
          if [[ ! "$target" =~ ^[0-9]+[.][0-9]+([.][0-9]+)?$ ]]; then
            echo "Release requires a stable minecraft_version; found: $target" >&2
            exit 1
          fi
          echo "version=$target" >> "$GITHUB_OUTPUT"

      - name: Run all tests and verification checks
        env:
          MOD_VERSION: ${{ steps.version.outputs.version }}
        run: ./gradlew --no-daemon clean check -Pmod_version="$MOD_VERSION"

      - name: Build release artifacts
        env:
          MOD_VERSION: ${{ steps.version.outputs.version }}
        run: ./gradlew --no-daemon jar sourcesJar -Pmod_version="$MOD_VERSION"

      - name: Create checksums
        working-directory: build/libs
        run: sha256sum -- ./*.jar > SHA256SUMS

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" build/libs/*.jar build/libs/SHA256SUMS --clobber
          else
            gh release create "$RELEASE_TAG" \
              build/libs/*.jar \
              build/libs/SHA256SUMS \
              --verify-tag \
              --generate-notes \
              --title "Jm2Bm ${{ steps.version.outputs.version }}"
          fi

      - name: Read GitHub Release metadata
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" > "$RUNNER_TEMP/github-release.json"
          jq -r '.body // ""' "$RUNNER_TEMP/github-release.json" > .github-release-changelog.md

          version_type="release"
          if [[ "$(jq -r '.prerelease' "$RUNNER_TEMP/github-release.json")" == "true" ]]; then
            version_type="beta"
          fi
          echo "version_type=$version_type" >> "$GITHUB_OUTPUT"

      - name: Validate CurseForge configuration
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
        shell: bash
        run: |
          if [[ -z "$CURSEFORGE_TOKEN" ]]; then
            echo "Missing repository secret CURSEFORGE_TOKEN" >&2
            exit 1
          fi
          if [[ ! "$CURSEFORGE_PROJECT_ID" =~ ^[0-9]+$ ]]; then
            echo "Repository variable CURSEFORGE_PROJECT_ID must be a numeric CurseForge project ID" >&2
            exit 1
          fi

      - name: Publish CurseForge release
        uses: Kira-NT/mc-publish@c23376546a97f5ba7984e94445da359459b14419 # v3
        with:
          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: build/libs/jm2bm-${{ steps.version.outputs.version }}.jar
          name: Jm2Bm ${{ steps.version.outputs.version }}
          version: ${{ steps.version.outputs.version }}
          version-type: ${{ steps.release.outputs.version_type }}
          changelog-file: .github-release-changelog.md
          loaders: |
            fabric
            neoforge
          environment: server
          game-versions: ${{ steps.minecraft.outputs.version }}
          game-version-filter: none
          dependencies: |
            journeymap(required)
            bluemap(required)
