plugins {
    id "java"
    id "maven-publish"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

def archiveBaseName = project.archives_base_name
def commonBuildDirectory = project(":common").layout.buildDirectory
def fabricBuildDirectory = project(":fabric").layout.buildDirectory
def neoForgeBuildDirectory = project(":neoforge").layout.buildDirectory

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

sourceSets {
    main {
        java.setSrcDirs([])
        resources.setSrcDirs([])
    }
    test {
        java.setSrcDirs([])
        resources.setSrcDirs([])
    }
}

tasks.named("jar", Jar) {
    dependsOn(":common:classes", ":fabric:classes", ":neoforge:classes")
    from(commonBuildDirectory.dir("classes/java/main"))
    from(commonBuildDirectory.dir("resources/main"))
    from(fabricBuildDirectory.dir("classes/java/main")) {
        include("se/jesper/jm2bm/fabric/**")
    }
    from(fabricBuildDirectory.dir("resources/main")) {
        include("fabric.mod.json")
        include("META-INF/jarjar/flow-math-1.0.3.jar")
    }
    from(neoForgeBuildDirectory.dir("classes/java/main")) {
        include("se/jesper/jm2bm/neoforge/**")
    }
    from(neoForgeBuildDirectory.dir("resources/main")) {
        include("META-INF/neoforge.mods.toml")
        include("META-INF/jarjar/metadata.json")
    }
    from("LICENSE") {
        rename { "${it}_${archiveBaseName}" }
    }
    duplicatesStrategy = DuplicatesStrategy.FAIL
}

tasks.named("sourcesJar", Jar) {
    dependsOn(":common:classes", ":fabric:classes", ":neoforge:classes")
    from("src/main/java")
    from("src/main/resources") {
        exclude("fabric.mod.json")
    }
    from("fabric/src/main/java")
    from("fabric/src/main/resources")
    from("neoforge/src/main/java")
    from("neoforge/src/main/resources")
}

tasks.named("check") {
    dependsOn("verifyUniversalJar", ":common:test", ":fabric:check", ":neoforge:check")
}

def universalJarFile = tasks.named("jar", Jar).flatMap { it.archiveFile }
tasks.register("verifyUniversalJar") {
    dependsOn(tasks.named("jar"))
    inputs.file(universalJarFile)
    doLast {
        def requiredEntries = [
                "fabric.mod.json",
                "META-INF/neoforge.mods.toml",
                "META-INF/jarjar/metadata.json",
                "META-INF/jarjar/flow-math-1.0.3.jar",
                "se/jesper/jm2bm/fabric/Jm2BmFabric.class",
                "se/jesper/jm2bm/neoforge/Jm2BmNeoForge.class",
                "se/jesper/jm2bm/Jm2BmMod.class"
        ]
        new java.util.zip.ZipFile(universalJarFile.get().asFile).withCloseable { zip ->
            requiredEntries.each { entry ->
                if (zip.getEntry(entry) == null) {
                    throw new GradleException("Universal JAR is missing ${entry}")
                }
            }
            if (zip.entries().any { entry ->
                entry.name.startsWith("journeymap/api/")
                        || entry.name.startsWith("de/bluecolored/bluemap/api/")
            }) {
                throw new GradleException("Universal JAR must not bundle JourneyMap or BlueMap API classes")
            }
        }
    }
}

tasks.withType(AbstractArchiveTask).configureEach {
    reproducibleFileOrder = true
    preserveFileTimestamps = false
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
}
